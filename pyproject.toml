[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metaprobe"
version = "0.1.0"
description = "A lightweight Python library for extracting metadata from webpages."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "metadata",
    "web-scraping",
    "html",
    "open-graph",
    "seo"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.25,<1"
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
    "mypy"
]

[tool.hatch.build.targets.wheel]
packages = ["src/metaprobe"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
xfail_strict = true
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

